[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-destination-lab"
version = "1.6.0"
description = "End-to-end raw telemetry to mapped vehicle-destination predictions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.8,<1.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.61,<2"]
notebook = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<8"]
tensorflow = ["tensorflow>=2.16,<3", "pydot>=3,<5"]
parquet = ["pyarrow>=15,<24"]
all = ["streamlit>=1.61,<2", "jupyterlab>=4.2,<5", "ipykernel>=6.29,<8", "tensorflow>=2.16,<3", "pydot>=3,<5", "pyarrow>=15,<24"]

[tool.setuptools.package-data]
vehicle_destination = ["ui/assets/*.js", "ui/assets/*.css", "ui/assets/LEAFLET_LICENSE"]

[project.scripts]
vehicle-destination = "vehicle_destination.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vehicle_destination*"]
