config_version: 1
project_name: vehicle-destination-prediction
random_seed: 42

data:
  raw_data: data/sample/raw_data.csv
  work_dir: artifacts/demo
  trips_file: trips.csv
  points_file: trip_points.csv

dataset:
  # The destination point is always excluded. 0.0 uses departure only.
  prefix_fractions: [0.0, 0.25, 0.5]
  validation_vin_fraction: 0.15
  test_vin_fraction: 0.15
  split_seed: 42
  grid_cell_size_degrees: 0.01
  max_history_trips: 20
  max_trajectory_points: 100

baseline:
  n_estimators: 120
  min_samples_leaf: 1
  max_depth: null
  n_jobs: -1

keras:
  encoder: GRU
  recurrent_units: 32
  recurrent_layers: 1
  dense_units: [64, 32]
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 32
  epochs: 50
  early_stopping_patience: 7

evaluation:
  top_k: [1, 3, 5]
  recall_distance_km: [1.0, 5.0, 10.0, 25.0]

trip_builder:
  columns:
    vin: vin
    trigger: triggerOrContext
    signal: name
    scalar_value: scalarValue
    series_value: timeSeriesValue
    timestamp: vehicleCollectionTime
    ingestion_timestamp: inCdpTime
    metadata: [fuel, hyb, model]
  triggers:
    start: Vehicle/Trigger/StartOfJourney
    end: Vehicle/Trigger/EndOfJourney
    trajectory: UCD/Sent/Trigger/Trg_periodic_5_seconds
  signals:
    latitude: locationLatitude
    longitude: locationLongitude
    altitude: lastKnownLocationAltitude
  eligibility:
    include_vins: []
    exclude_vins: []
    min_duration_seconds: 1
    max_duration_seconds: 86400
    min_points: 2
    min_distance_m: 0
    max_distance_m: 1000000
    max_segment_speed_kmh: 250
    endpoint_match_tolerance_m: 30
  processing:
    timezone: UTC
    series_length_policy: reject
    add_missing_trigger_endpoints: true
    fallback_to_trigger_endpoints: true
    remove_exact_duplicates: true
    coordinate_decimals: 7
